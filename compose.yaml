# SafetyTravel Assistant — runtime topology (ดู IMPLEMENTATION_PLANS/00_GIT_DOCKER_DELIVERY_RULES.md §8)
#
# infra กลาง (postgres redis qdrant keycloak) ไม่มี profile = ขึ้นเสมอ → `docker compose up -d <service>` ของ module ใดก็ได้
# จะดึง infra ที่ต้องพึ่งขึ้นมาให้เอง ไม่ต้องใส่ --profile
# profiles:
#   app           web api agent external-data data-integration        ← เจ้าของแต่ละ module เพิ่ม service ของตัวเอง
#                 risk-knowledge decision-engine recommendation          ใน Phase 1 ผ่าน PR (ดูตัวอย่างท้ายไฟล์)
#   observability otel-collector prometheus grafana                   ← lead
#
# ใช้คู่กับ compose.dev.yaml ตอนพัฒนา:
#   docker compose -f compose.yaml -f compose.dev.yaml up -d                    # infra กลางอย่างเดียว
#   docker compose -f compose.yaml -f compose.dev.yaml --profile app up -d      # + service ทุก module
# ไฟล์นี้เป็น shared surface: แก้แล้วต้องมี lead รีวิว ห้ามใส่ secret จริง ห้ามใส่ host-specific path

name: smart-travel

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_travel}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      RISK_KNOWLEDGE_DB_USER: ${RISK_KNOWLEDGE_DB_USER:-risk_knowledge}
      # Optional for the shared database container. The Module 06 bootstrap
      # script skips its role when this module-specific secret is absent.
      RISK_KNOWLEDGE_DB_PASSWORD: ${RISK_KNOWLEDGE_DB_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smart_travel} -d ${POSTGRES_DB:-smart_travel}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-smart_travel}
      KC_DB_USERNAME: ${POSTGRES_USER:-smart_travel}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_DB_SCHEMA: keycloak
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # ตาม Keycloak docs (image ไม่มี curl): เปิด TCP ไป management port 9000 แล้วยิง GET /health/ready
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q '\"status\": \"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  external-data:
    build:
      context: ./services/external-data
      target: runtime
    profiles: [app]
    env_file: .env
    environment:
      # Container DNS, not host ports (shared context § 3).
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      GTFS_PROVIDER_CONFIG: /app/config/providers.yaml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  data-integration:
    image: smart-travel-data-integration:runtime
    build:
      context: ./services/data-integration
      additional_contexts:
        contracts: ./packages/contracts/generated/python
      target: runtime
    profiles: [app]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  api:
    # Public API (module 02) — the only service the browser talks to besides web.
    # No host port here: production topology exposes nothing directly. compose.dev.yaml
    # publishes 8000 for local work.
    #
    # The tag is explicit because compose.dev.yaml builds a different stage of the same
    # Dockerfile. Left to the default name both stages would land on `smart-travel-api`, and
    # whichever was built last would win: build the dev stage, then `up` without the override,
    # and the service starts the dev image, whose CMD is `uv run pytest` — it runs the suite,
    # exits, and `restart: unless-stopped` loops it, never serving a request.
    image: smart-travel-api:runtime
    build:
      context: ./services/api
      target: runtime
    profiles: [app]
    env_file: .env
    environment:
      SERVICE_NAME: api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      # Liveness only. Readiness depends on PostgreSQL, Redis and Keycloak; restarting the
      # container whenever one of those blinks would turn a recoverable outage into a crash loop.
      # Probe /health/ready separately — the acceptance runbook does.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  web:
    # Browser-facing application. The runtime image is standalone and runs as
    # its own non-root user; host publication belongs in compose.dev.yaml.
    image: smart-travel-web:runtime
    build:
      context: ./apps/web
      target: runtime
    profiles: [app]
    env_file: .env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  risk-knowledge:
    build:
      context: ./services/risk-knowledge
      target: runtime
    profiles: [app]
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CONTRACT_VERSION: ${CONTRACT_VERSION:-1.0.0}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-smart_travel}
      POSTGRES_USER: ${RISK_KNOWLEDGE_DB_USER:-risk_knowledge}
      POSTGRES_PASSWORD: ${RISK_KNOWLEDGE_DB_PASSWORD:-}
      QDRANT_URL: http://qdrant:6333
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      DATA_INTEGRATION_URL: http://data-integration:8003
      DATA_INTEGRATION_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      RISK_KNOWLEDGE_REQUIRE_ARTIFACT_SIGNATURE: ${RISK_KNOWLEDGE_REQUIRE_ARTIFACT_SIGNATURE:-true}
      RISK_KNOWLEDGE_ARTIFACT_PUBLIC_KEY_PATH: ${RISK_KNOWLEDGE_ARTIFACT_PUBLIC_KEY_PATH:-}
      RISK_KNOWLEDGE_ACTIVE_MODEL_NAME: ${RISK_KNOWLEDGE_ACTIVE_MODEL_NAME:-route-risk-baseline}
      RISK_KNOWLEDGE_QDRANT_COLLECTION_PREFIX: ${RISK_KNOWLEDGE_QDRANT_COLLECTION_PREFIX:-sta-knowledge}
      RISK_KNOWLEDGE_QDRANT_ACTIVE_ALIAS: ${RISK_KNOWLEDGE_QDRANT_ACTIVE_ALIAS:-sta-knowledge-active}
      RISK_KNOWLEDGE_QDRANT_VECTOR_SIZE: ${RISK_KNOWLEDGE_QDRANT_VECTOR_SIZE:-768}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: risk-knowledge
    volumes:
      - risk-model-artifacts:/artifacts:ro
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  decision-engine:
    build:
      context: ./services/decision-engine
      target: runtime
    profiles: [app]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DECISION_ENGINE_VERSION: ${DECISION_ENGINE_VERSION:-0.1.0}
      CONTRACT_VERSION: ${CONTRACT_VERSION:-1.0.0}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      DECISION_DATABASE_URL: postgresql://${POSTGRES_USER:-smart_travel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smart_travel}
      DECISION_POLICY_CHECKSUM: ${DECISION_POLICY_CHECKSUM:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    profiles: [training]
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --default-artifact-root
      - /mlflow/artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  recommendation:
    image: smart-travel-recommendation:runtime
    build:
      context: ./services/recommendation
      target: runtime
    profiles: [app]
    env_file: .env
    environment:
      SERVICE_NAME: recommendation
      PORT: 8006
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-smart_travel}
      POSTGRES_USER: ${POSTGRES_USER:-smart_travel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SCHEMA: recommendation
      REDIS_URL: redis://redis:6379/0
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      EMERGENCY_DIRECTORY_PATH: /app/emergency-directory/sources.yaml
      CONTRACT_VERSION: ${CONTRACT_VERSION:-1.0.0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  agent:
    image: smart-travel-agent:runtime
    build:
      context: ./services/agent
      target: runtime
    profiles: [app]
    env_file: .env
    environment:
      SERVICE_NAME: agent
      PORT: 8001
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-smart_travel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smart_travel}
      REDIS_URL: redis://redis:6379/0
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      EXTERNAL_DATA_BASE_URL: http://external-data:8002
      DATA_INTEGRATION_BASE_URL: http://data-integration:8003
      RISK_KNOWLEDGE_BASE_URL: http://risk-knowledge:8004
      DECISION_ENGINE_BASE_URL: http://decision-engine:8005
      RECOMMENDATION_BASE_URL: http://recommendation:8006
      CONTRACT_VERSION: ${CONTRACT_VERSION:-1.0.0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  risk-model-artifacts:
  mlflow-data:
