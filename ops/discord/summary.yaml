  # ───────────────────────────────── 1. เป้าหมาย ─────────────────────────────────
  - pin: true
    content: "📖 **ห้องนี้คือภาพรวมโปรเจกต์** อ่านจากบนลงล่างครั้งเดียว จะเข้าใจว่าเราทำอะไร ทำไม และตัวเองอยู่ตรงไหน"
    title: "🎯 เราจะทำอะไร — SafetyTravel Assistant"
    color: 0x25C7AE
    image: assets/illustrations/hero-global-travel-banner.png
    thumbnail: assets/mascot/mascot-welcome.png
    description: |
      **พูดง่าย ๆ:** เว็บแอปที่ช่วยคนเดินทางตอบคำถามเดียวว่า **"ทริปนี้ไปได้ไหม ปลอดภัยแค่ไหน ถ้าไม่ปลอดภัยควรทำยังไง"**

      ผู้ใช้บอกแค่ว่า *จะไปจากไหน ไปไหน วันไหน ไปยังไง* ระบบจะไปดึงข้อมูล **ของจริง ณ ตอนนั้น** มาให้ —
      สภาพอากาศ · สถานะรถ/เครื่องบิน/รถไฟ · เหตุภัยพิบัติ (น้ำท่วม แผ่นดินไหว พายุ) · ถนน/เส้นทางที่ปิด · เบอร์ฉุกเฉินของประเทศนั้น
      แล้วสรุปออกมาเป็น **คำตอบเดียวที่เข้าใจง่าย + เหตุผล + หลักฐานว่าเอาข้อมูลมาจากไหน เมื่อไหร่**

      **คำตอบมีแค่ 4 แบบ** (ทั้งระบบทำงานเพื่อเลือก 1 ใน 4 นี้)
      🟢 **ไปได้ตามแผน** (NORMAL)
      🟡 **เปลี่ยนเส้นทาง** (CHANGE_ROUTE) — มีทางอื่นที่ปลอดภัยกว่า
      🟠 **เลื่อนเวลา** (DELAY) — รอสักพักความเสี่ยงจะลดลง เช่น รอพายุผ่าน
      🔴 **อย่าไป** (AVOID) — เสี่ยงสูง หรือทางการสั่งปิด

      **สิ่งที่ทำให้โปรเจกต์นี้ต่างจากแอปทั่วไป**
      • ไม่มีข้อมูลปลอมเลย ทุกตัวเลขบนหน้าจอต้องมาจากแหล่งจริง พร้อมบอกเวลาอัปเดต ถ้าดึงไม่ได้ต้องบอกตรง ๆ ว่า "ไม่มีข้อมูล"
      • AI **ไม่ใช่คนตัดสิน** — ระบบตัดสินด้วยกฎที่ตรวจสอบได้ก่อน แล้ว AI มีหน้าที่แค่ "อธิบายให้คนอ่านรู้เรื่อง"
      • คำเตือนจากทางการ (เช่น ประกาศปิดถนน) ชนะทุกอย่าง ต่อให้โมเดลบอกว่าปลอดภัยก็ต้องขึ้น 🔴
      • มีปุ่ม SOS ที่ใช้ได้ทันทีโดยไม่ต้องรอ AI

      **สิ่งที่เราไม่ทำ** (จะได้ไม่หลงทาง): ไม่จองตั๋ว/โรงแรม · ไม่โทรแจ้งเหตุให้อัตโนมัติ (แค่แสดงเบอร์ให้กด) · ไม่รับประกันความปลอดภัย 100%

      โค้ดอยู่ที่ {repo}

  # ───────────────────────────────── 2. โฟลว์ ─────────────────────────────────
  - pin: true
    title: "🔁 ระบบทำงานยังไง — เดินตามคำขอของผู้ใช้ 1 ครั้ง"
    color: 0x0FA78F
    image: assets/illustrations/global-map-background.png
    description: |
      ลองนึกภาพผู้ใช้กด **"หาเส้นทางที่ปลอดภัย"** 1 ครั้ง ข้อมูลจะวิ่งผ่าน 8 ส่วน (= 8 คนในทีม) แบบนี้

      **1️⃣ หน้าเว็บ** {role:01-web} — รับข้อมูลทริปจากผู้ใช้ แสดงผลทุกอย่างที่ตามมา
      ⬇️
      **2️⃣ ประตูหน้าบ้าน (API)** {role:02-api} — เช็กว่าล็อกอินจริงไหม ข้อมูลครบไหม บันทึกทริปลงฐานข้อมูล แล้วส่งต่อ
      ⬇️
      **3️⃣ ผู้ประสานงาน (Agent)** {role:03-agent} — วางแผนว่าต้องไปถามข้อมูลอะไรบ้าง สั่งงานส่วน 4–8 ตามลำดับ และจำบทสนทนาไว้ให้ถามต่อได้
      ⬇️
      **4️⃣ คนไปหาข้อมูล** {role:04-external-data} — ออกไปดึงอากาศ / สถานะขนส่ง / ภัยพิบัติ / พิกัดสถานที่ จากเว็บไซต์ของจริง
      ⬇️
      **5️⃣ คนจัดระเบียบข้อมูล** {role:05-data-integration} — ข้อมูลจากหลายที่มีหน่วย เวลา รูปแบบไม่เหมือนกัน ต้องแปลงให้เป็นภาษาเดียวกัน ตัดของซ้ำ และ **จับคู่ว่าเหตุการณ์ไหนอยู่บนเส้นทางของเรา ช่วงเวลาที่เราจะผ่านพอดี**
      ⬇️
      **6️⃣ คนประเมินความเสี่ยง** {role:06-risk-knowledge} — ให้คะแนนความเสี่ยงด้วยโมเดลของเราเอง ค้นคู่มือรับมือภัยจากเอกสารหน่วยงาน และหาเส้นทางสำรองที่ปลอดภัยกว่า
      ⬇️
      **7️⃣ คนตัดสินใจ** {role:07-decision-engine} — ดูหลักฐานทั้งหมดแล้วเลือก 1 ใน 4 คำตอบ ด้วย "กฎ" ที่ตรวจสอบได้ ล็อกคำตอบไว้ แล้วให้ AI เขียนคำอธิบายจากหลักฐานเท่านั้น
      ⬇️
      **8️⃣ คนส่งมอบคำแนะนำ** {role:08-recommendation} — ประกอบเป็นคำตอบสุดท้ายที่ผู้ใช้เห็น แนบเบอร์ฉุกเฉิน ส่งแจ้งเตือนถ้าสถานการณ์เปลี่ยน และรับ feedback
      ⬇️
      **กลับไปหน้าเว็บ** — ผู้ใช้เห็นคำตอบ 🟢🟡🟠🔴 พร้อมเหตุผลและแหล่งที่มา

      **กติกาสำคัญของโฟลว์**
      • แต่ละส่วนคุยกันผ่าน "แบบฟอร์มกลาง" (contract) ที่ตกลงกันไว้ — ใครจะเปลี่ยนแบบฟอร์มต้องบอกทุกคนใน {ch:api-contracts}
      • ถ้าส่วนไหนล่ม ส่วนอื่นต้องยังทำงานได้และบอกผู้ใช้ตรง ๆ ว่า "ข้อมูลส่วนนี้ไม่พร้อม" ห้ามแต่งข้อมูลเติม
      • เปลี่ยนเส้นทางหรือเวลา = ต้องประเมินใหม่ทั้งหมด ห้ามเอาคะแนนเก่ามาใช้

  # ───────────────────────────────── 3. หน้าจอ ─────────────────────────────────
  - content: "🖼️ **หน้าจอที่เราจะทำ (7 หน้า)** — ภาพด้านล่างคือ \"เป้าหมาย\" ที่หน้าเว็บต้องออกมาให้เหมือน ตัวเลข/เมือง/วันที่ในภาพเป็นแค่ตัวอย่าง ของจริงต้องมาจากข้อมูลสด"
    title: "หน้า 0 · เข้าสู่ระบบ (Login)"
    color: 0x25C7AE
    image: assets/ui-screens/00-login.png
    description: |
      **ผู้ใช้เห็นอะไร:** หน้าแรกสุด สมัคร/ล็อกอิน หรือ "ลองใช้แบบไม่ล็อกอิน" ได้
      **ทำอะไรได้:** ล็อกอิน · ลืมรหัส · ล็อกอินผ่านองค์กร · สมัครใหม่ · ใช้แบบ guest · **ปุ่มฉุกเฉิน** ที่กดได้เลยโดยไม่ต้องล็อกอิน
      **ใครทำ:** หน้าตา {role:01-web} · ระบบบัญชี/ล็อกอินจริง {role:02-api}
      **ผลลัพธ์ที่ต้องได้:** สมัครแล้วมีบัญชีจริงในฐานข้อมูล ล็อกอินแล้วเข้าหน้า Dashboard ได้ กดฉุกเฉินแล้วไปหน้า Emergency ได้ทันที

  - title: "หน้า 1 · Dashboard — ภาพรวมทริปวันนี้"
    color: 0x25C7AE
    image: assets/ui-screens/01-dashboard-overview.png
    description: |
      **ผู้ใช้เห็นอะไร:** หน้าหลักหลังล็อกอิน — การ์ดอากาศ / ขนส่ง / ความเสี่ยง, ทริปปัจจุบันบนแผนที่, **คำแนะนำ 🟢🟡🟠🔴**, ปุ่ม SOS, ช่องถาม AI
      **ทำอะไรได้:** กดการ์ดเพื่อดูรายละเอียด · กดหมุดบนแผนที่ดูเหตุการณ์ · กด "ใช้เส้นทางที่ปลอดภัยกว่า" · เข้าหน้าอื่น ๆ ทุกหน้าจากตรงนี้
      **ใครทำ:** หน้าตา {role:01-web} · ข้อมูลบนการ์ดมาจาก {role:04-external-data} → {role:05-data-integration} · คำแนะนำมาจาก {role:07-decision-engine} → {role:08-recommendation}
      **ผลลัพธ์ที่ต้องได้:** ทุกการ์ดมี "อัปเดตเมื่อ ..." ถ้าข้อมูลไม่มาต้องขึ้น "ไม่มีข้อมูล" ไม่ใช่ตัวเลขมั่ว

  - title: "หน้า 2 · Trip Planner — สร้างทริป"
    color: 0x0FA78F
    image: assets/ui-screens/02-trip-planner.png
    description: |
      **ผู้ใช้เห็นอะไร:** ฟอร์มกรอก ต้นทาง → ปลายทาง, วันไป-กลับ, ไปยังไง (รถ/รถไฟ/เครื่องบิน/เดิน), ความชอบ (เร็วสุด/ปลอดภัยสุด)
      **ทำอะไรได้:** พิมพ์ชื่อสถานที่แล้วระบบหาพิกัดให้ยืนยันบนแผนที่ · กด **"Find safe routes"** · เลือกเส้นทางจาก 3 แบบ: แนะนำ / เร็วสุด / เสี่ยงน้อยสุด
      **ใครทำ:** หน้าตา {role:01-web} · บันทึกทริป {role:02-api} · หาพิกัดและเส้นทาง {role:04-external-data} · จัดอันดับเส้นทาง {role:06-risk-knowledge}
      **ผลลัพธ์ที่ต้องได้:** สร้างทริปแล้วมีอยู่จริงในฐานข้อมูล กลับมาเปิดใหม่ยังอยู่ และได้เส้นทางที่คำนวณจากของจริง

  - title: "หน้า 3 · Safety Map — แผนที่ความเสี่ยง"
    color: 0x7657D6
    image: assets/ui-screens/03-global-safety-map.png
    description: |
      **ผู้ใช้เห็นอะไร:** แผนที่ใหญ่ทั้งหน้า มีหมุดเหตุการณ์ (พายุ น้ำท่วม แผ่นดินไหว ถนนปิด) เปิด/ปิดชั้นข้อมูลได้: อากาศ / ขนส่ง / ภัยธรรมชาติ / สุขภาพ-ความปลอดภัย
      **ทำอะไรได้:** กดหมุดดูรายละเอียดและเวลาอัปเดต · เลื่อนดู "ตอนนี้ / อีก 6 ชม. / อีก 12 ชม." · กด **"Avoid area"** ให้ระบบหาทางเลี่ยง
      **ใครทำ:** แผนที่ {role:01-web} (ต้องเป็นแผนที่จริงที่ซูม/ลากได้ ไม่ใช่รูป) · หมุดเหตุการณ์ {role:04-external-data} + {role:05-data-integration}
      **ผลลัพธ์ที่ต้องได้:** หมุดทุกอันกดแล้วบอกได้ว่ามาจากแหล่งไหน เมื่อไหร่ กด Avoid area แล้วไปหน้าเปรียบเทียบเส้นทางได้

  - title: "หน้า 4 · AI Assistant — ถาม-ตอบกับผู้ช่วย"
    color: 0x73D7E8
    image: assets/ui-screens/04-ai-assistant.png
    description: |
      **ผู้ใช้เห็นอะไร:** หน้าแชต ถามเป็นภาษาคนได้ เช่น "พรุ่งนี้ไปเชียงใหม่ทางรถ โอเคไหม" AI ตอบทีละคำ (streaming) พร้อมแนบแผนที่ปลอดภัยกว่า มีปุ่มคำถามสำเร็จรูป
      **ทำอะไรได้:** ถามต่อจากบทสนทนาเดิมได้ · แชร์ตำแหน่งปัจจุบันให้ AI (ต้องขออนุญาตก่อน) · กด "อัปเดตทริปตามที่ AI แนะนำ" · กดไปหน้าฉุกเฉิน
      **ใครทำ:** หน้าตา {role:01-web} · ส่งข้อความผ่าน {role:02-api} · สมองที่วางแผนและจำบทสนทนา {role:03-agent} · คำอธิบายจาก {role:07-decision-engine}
      **ผลลัพธ์ที่ต้องได้:** ถามเรื่อง "ตอนนี้" แล้ว AI ต้องไปดึงข้อมูลใหม่ ไม่ตอบจากความจำ และ **ห้าม AI ตอบว่าปลอดภัยเองโดยไม่ผ่านส่วน 7**

  - title: "หน้า 5 · Emergency Center — ศูนย์ฉุกเฉิน"
    color: 0xF05252
    image: assets/ui-screens/05-emergency-center.png
    thumbnail: assets/mascot/mascot-emergency-help.png
    description: |
      **ผู้ใช้เห็นอะไร:** ปุ่ม SOS ใหญ่ (กดค้าง 3 วินาที → ยืนยันอีกครั้ง กันกดพลาด), แชร์ตำแหน่ง, เบอร์ตำรวจ/โรงพยาบาล/สถานทูต **ของประเทศที่อยู่ตอนนี้**, ข้อมูลสุขภาพและผู้ติดต่อฉุกเฉินที่ตั้งไว้
      **ทำอะไรได้:** กด SOS · แชร์ตำแหน่งแบบเรียลไทม์ (หลังอนุญาต) · หาหน่วยฉุกเฉินที่ใกล้ที่สุด · ตรวจข้อมูลก่อนส่ง
      **ใครทำ:** หน้าตา {role:01-web} · โปรไฟล์ฉุกเฉิน/ความยินยอม {role:02-api} · เบอร์และคู่มือรับมือภัยที่ตรวจสอบแล้ว {role:06-risk-knowledge} + {role:08-recommendation}
      **ผลลัพธ์ที่ต้องได้:** หน้านี้ต้องเปิดได้แม้ยังไม่ล็อกอินและแม้ AI ล่ม · เบอร์ต้องถูกประเทศ · ห้ามส่งตำแหน่งก่อนผู้ใช้กดอนุญาต

  - title: "หน้า 6 · Route Comparison — เทียบเส้นทางเดิม vs ปลอดภัยกว่า"
    color: 0x10B981
    image: assets/ui-screens/06-route-comparison.png
    description: |
      **ผู้ใช้เห็นอะไร:** สองเส้นทางวางคู่กัน — เดิม vs ที่ระบบแนะนำ บอกชัด ๆ ว่าแลกอะไรกับอะไร: เวลาเพิ่ม/ลด กี่นาที · ระยะทาง · ความเสี่ยง · ข้อมูลอัปเดตเมื่อไหร่
      **ทำอะไรได้:** กด **"ใช้เส้นทางที่ปลอดภัยกว่า"** (ทริปเปลี่ยนจริง) · หรือ "ใช้เส้นทางเดิม" แต่ต้องติ๊กยอมรับความเสี่ยงก่อน · เปิดแจ้งเตือนเมื่อสถานการณ์เปลี่ยน
      **ใครทำ:** หน้าตา {role:01-web} · เส้นทางสำรองและคะแนน {role:06-risk-knowledge} · เหตุผลว่าทำไมแนะนำ {role:07-decision-engine} · การแจ้งเตือน {role:08-recommendation}
      **ผลลัพธ์ที่ต้องได้:** กดใช้เส้นทางใหม่แล้ว Dashboard และแจ้งเตือนต้องเปลี่ยนตาม และระบบต้องประเมินความเสี่ยงใหม่ทั้งหมด

  # ───────────────────────────────── 4. ใครทำอะไร ─────────────────────────────────
  - pin: true
    title: "👥 ใครทำส่วนไหน และส่วนนั้นต้อง \"ส่งมอบ\" อะไร"
    color: 0xFF8A1F
    image: assets/safetytravel-discord/embed-task-assigned.png
    thumbnail: assets/branding/app-logo-mark.png
    description: |
      แต่ละส่วนคือ "กล่อง" ที่ **รับของเข้า → ทำงาน → ส่งของออก** ของที่ส่งออกต้องตรงแบบฟอร์มกลางเพื่อให้กล่องถัดไปรับได้
      ใบงานละเอียด (โฟลเดอร์ คำสั่ง กติกา) ปักหมุดอยู่ในห้องของแต่ละคน
    fields:
      - name: "1️⃣ หน้าเว็บ · {role:01-web}"
        value: |
          **รับ:** ข้อมูลจาก API
          **ทำ:** 7 หน้าจอตามภาพด้านบน ใช้ได้ทั้งคอมและมือถือ
          **ส่งมอบ:** เว็บที่กดได้จริงทุกปุ่ม ทุกการ์ดมีเวลาอัปเดต มีสถานะ "กำลังโหลด / ไม่มีข้อมูล / ผิดพลาด"
      - name: "2️⃣ ประตูหน้าบ้าน · {role:02-api}"
        value: |
          **รับ:** คำขอจากหน้าเว็บ
          **ทำ:** ล็อกอิน สมัคร บันทึกทริป/ผู้ใช้/ความยินยอม เช็กความถูกต้อง ส่งต่อให้ Agent
          **ส่งมอบ:** ระบบบัญชีจริง + ฐานข้อมูลจริง + "แบบฟอร์มกลาง" ที่ทุกคนใช้ร่วมกัน
      - name: "3️⃣ ผู้ประสานงาน · {role:03-agent}"
        value: |
          **รับ:** ทริปที่ตรวจแล้วจาก API
          **ทำ:** วางลำดับว่าจะถามข้อมูลอะไร สั่งงานส่วน 4–8 จำบทสนทนา มีเวลาจำกัด ไม่วนลูปไม่รู้จบ
          **ส่งมอบ:** คำตอบที่ย้อนดูได้ว่ามาจากหลักฐานชิ้นไหน
      - name: "4️⃣ คนหาข้อมูล · {role:04-external-data}"
        value: |
          **รับ:** พิกัด + ช่วงเวลา
          **ทำ:** ดึงอากาศ ขนส่ง ภัยพิบัติ พิกัด จากเว็บของจริง (Open-Meteo, USGS, GDACS ฯลฯ)
          **ส่งมอบ:** ข้อมูลสดพร้อมป้าย "มาจากไหน เมื่อไหร่ เชื่อได้แค่ไหน" — ถ้าแหล่งล่มต้องบอกว่าล่ม
      - name: "5️⃣ คนจัดระเบียบ · {role:05-data-integration}"
        value: |
          **รับ:** ข้อมูลดิบจากหลายแหล่ง
          **ทำ:** แปลงหน่วย/เวลา/พิกัดให้ตรงกัน ตัดซ้ำ จับคู่เหตุการณ์กับ "แนวเส้นทาง + เวลาที่จะผ่าน"
          **ส่งมอบ:** ชุดข้อมูล 1 ก้อนต่อ 1 คำขอ ที่โมเดลเอาไปใช้ได้ทันที
      - name: "6️⃣ คนประเมินความเสี่ยง · {role:06-risk-knowledge}"
        value: |
          **รับ:** ชุดข้อมูลที่จัดแล้ว
          **ทำ:** ให้คะแนนเสี่ยง + บอกเหตุผล · ค้นคู่มือรับมือภัยจากเอกสารทางการ · หาเส้นทางสำรอง
          **ส่งมอบ:** คะแนนความเสี่ยง, คู่มือพร้อมอ้างอิง, เส้นทาง 2–3 แบบเรียงตามความปลอดภัย
      - name: "7️⃣ คนตัดสินใจ · {role:07-decision-engine}"
        value: |
          **รับ:** คะแนน คู่มือ เส้นทาง ประกาศทางการ
          **ทำ:** เลือก 🟢🟡🟠🔴 ด้วยกฎที่เขียนไว้ชัด (ประกาศทางการชนะเสมอ) แล้วให้ AI อธิบายจากหลักฐานเท่านั้น
          **ส่งมอบ:** คำตอบ 1 ใน 4 + คำอธิบายภาษาคน ที่ตรวจได้ว่าไม่มีการมั่ว
      - name: "8️⃣ คนส่งมอบ · {role:08-recommendation}"
        value: |
          **รับ:** คำตอบที่ล็อกแล้ว
          **ทำ:** ประกอบเป็นหน้าคำแนะนำ แนบเบอร์ฉุกเฉินถูกประเทศ ส่งแจ้งเตือนเมื่อสถานการณ์เปลี่ยน รับ feedback
          **ส่งมอบ:** สิ่งที่ผู้ใช้เห็นและกดทำตามได้ + ระบบแจ้งเตือน + บันทึก feedback
      - name: "👑 หัวหน้า · {role:lead}"
        value: |
          Docker ที่รันทุกส่วนพร้อมกัน · CI เช็กโค้ดอัตโนมัติ · รีวิว/merge ทุก PR · จัดการแบบฟอร์มกลาง · วันรวมระบบและซ้อม demo

  # ───────────────────────────────── 5. ภาพความสำเร็จ ─────────────────────────────────
  - title: "🏁 หน้าตาความสำเร็จ — วัน demo ต้องโชว์อะไรได้"
    color: 0x10B981
    image: assets/safetytravel-discord/embed-deploy-success.png
    description: |
      ถ้าทำได้ครบนี่คือ "เสร็จ" — ทุกข้อใช้ข้อมูลสดของวันนั้นจริง ๆ ไม่มีของปลอม

      ✅ สมัคร → ล็อกอิน → สร้างทริป → เห็นเส้นทางบนแผนที่ → ได้คำแนะนำ 🟢🟡🟠🔴 พร้อมเหตุผลและแหล่งที่มา
      ✅ ทริปที่มีฝน/พายุทับเส้นทาง → ระบบบอก **เปลี่ยนเส้นทาง** หรือ **เลื่อนเวลา** และอธิบายว่าทำไม
      ✅ มีประกาศปิดถนนจากทางการ → ต้องขึ้น **อย่าไป** เสมอ ต่อให้โมเดลบอกว่าเสี่ยงต่ำ
      ✅ ปิดแหล่งข้อมูลหนึ่งแหล่ง (จำลองว่าล่ม) → ระบบยังทำงาน บอกตรง ๆ ว่าส่วนนั้นไม่มีข้อมูล ไม่พัง ไม่มั่ว
      ✅ กดใช้เส้นทางใหม่ → ทริปเปลี่ยนจริง ประเมินใหม่ Dashboard อัปเดตตาม
      ✅ ถาม AI ต่อจากบทสนทนาเดิม → จำเรื่องเก่าได้ แต่ข้อมูล "ตอนนี้" ต้องดึงใหม่
      ✅ กด SOS → กดค้าง + ยืนยัน + ขออนุญาตก่อนแชร์ตำแหน่ง เบอร์ตรงประเทศ
      ✅ ผู้ใช้ให้ feedback ว่า "คำแนะนำไม่ปลอดภัย" → เก็บแยกไว้ให้คนตรวจ ไม่เอาไปสอนโมเดลทันที

      **ทุกหน้าจอต้องเหมือนภาพด้านบน** และ `docker compose up --build` คำสั่งเดียวแล้วทั้งระบบขึ้นครบ

  # ───────────────────────────────── 6. เริ่มยังไง ─────────────────────────────────
  - title: "🚀 แล้วแต่ละคนเริ่มยังไง"
    color: 0x25C7AE
    thumbnail: assets/mascot/mascot-welcome.png
    description: |
      1. เข้าห้องของตัวเอง (ชื่อห้องขึ้นต้นด้วยเลข module) → กด 📌 ปักหมุด → อ่านใบงาน
      2. อ่านไฟล์ 3 ไฟล์กลางใน `IMPLEMENTATION_PLANS/` ก่อน แล้วค่อยอ่านไฟล์ของตัวเอง (ใบงานบอกลำดับไว้)
      3. สร้าง branch ตามที่ใบงานเขียน แล้วทำงานเป็นชิ้นเล็ก ๆ ส่ง PR บ่อย ๆ (ไม่ต้องรอเสร็จทั้งก้อน)
      4. เปิด PR แล้วบอทจะแจ้งใน {ch:pull-requests} — หัวหน้ารีวิว + เทสจริง แล้วผลจะเด้งกลับในห้องของคุณพร้อมวิธีแก้
      5. ไม่เข้าใจอะไร ถามใน {ch:help} ได้ทุกเรื่อง บอกว่า module ไหน ติดตรงไหน ลองอะไรไปแล้ว

      **จำไว้ 3 ข้อ:** ห้ามข้อมูลปลอม · ห้าม push เข้า main ตรง · แตะแบบฟอร์มกลางต้องบอกทุกคนก่อน
      คำถามภาพรวม/เป้าหมาย ถามในห้องนี้ได้เลย 🙌
