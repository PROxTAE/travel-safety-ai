# Overrides สำหรับพัฒนาบนเครื่องตัวเอง: เปิด host port, hot reload (source mount)
# ใช้คู่กับ compose.yaml เสมอ:
#   docker compose -f compose.yaml -f compose.dev.yaml --profile core up -d
# ห้ามใช้ไฟล์นี้ตอน demo / รวมระบบ

services:
  postgres:
    ports: ["5432:5432"]

  redis:
    ports: ["6379:6379"]

  qdrant:
    ports: ["6333:6333", "6334:6334"]

  keycloak:
    ports: ["8080:8080"]

  external-data:
    ports: ["8002:8002"]
    volumes:
      - ./services/external-data/app:/app/app:ro
      - ./services/external-data/config:/app/config:ro
    # Migrate before serving so a fresh clone works from `up` alone. Dev only:
    # the image CMD stays uvicorn, and readiness reports the mirror either way.
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload

  api:
    ports: ["8000:8000"]
    environment:
      # The browser runs on the host, so the API must accept the host origin during development.
      API_CORS_ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      # Read-only mount: the container reloads on save but cannot write back into the repository.
      - ./services/api/app:/app/app:ro
      - ./services/api/migrations:/app/migrations:ro
    command:
      [
        "uvicorn",
        "app.main:create_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--no-access-log",
      ]

  # ตัวอย่าง override ของ module (เจ้าของเพิ่มพร้อม service ใน compose.yaml)
  #
  # external-data:
  #   ports: ["8002:8002"]
  #   volumes:
  #     - ./services/external-data/app:/app/app:ro
  #   command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8002", "--reload"]
  #
  # web:
  #   ports: ["3000:3000"]
  #   volumes:
  #     - ./apps/web:/app
  #     - /app/node_modules
  #   command: ["pnpm", "dev"]
