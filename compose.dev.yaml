# Overrides สำหรับพัฒนาบนเครื่องตัวเอง: เปิด host port, hot reload (source mount)
# ใช้คู่กับ compose.yaml เสมอ:
#   docker compose -f compose.yaml -f compose.dev.yaml --profile core up -d
# ห้ามใช้ไฟล์นี้ตอน demo / รวมระบบ

services:
  postgres:
    ports: ["5432:5432"]

  redis:
    ports: ["6379:6379"]

  qdrant:
    ports: ["6333:6333", "6334:6334"]

  keycloak:
    ports: ["8080:8080"]
    environment:
      KC_HOSTNAME: http://keycloak.localhost:8080
    networks:
      default:
        aliases: [keycloak.localhost]

  external-data:
    ports: ["8002:8002"]
    volumes:
      - ./services/external-data/app:/app/app:ro
      - ./services/external-data/config:/app/config:ro
    # Migrate before serving so a fresh clone works from `up` alone. Dev only:
    # the image CMD stays uvicorn, and readiness reports the mirror either way.
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload

  data-integration:
    image: smart-travel-data-integration:dev
    build:
      target: dev
    ports: ["8003:8003"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smart_travel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smart_travel}
    volumes:
      - ./services/data-integration/app:/app/app:ro
      - ./services/data-integration/tests:/app/tests:ro
      - ./services/data-integration/alembic.ini:/app/alembic.ini:ro
      - ./services/data-integration/pyproject.toml:/app/pyproject.toml:ro
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8003 --reload

  api:
    # Its own tag, so building the dev stage cannot overwrite the runtime image that
    # compose.yaml starts. Same Dockerfile, different stage, different name.
    image: smart-travel-api:dev
    build:
      # The dev stage adds pytest, ruff and mypy on top of the same locked dependency set the
      # runtime image uses, so `docker compose run --rm api uv run pytest` checks the code against
      # the platform it will actually run on rather than against a developer's laptop.
      target: dev
    ports: ["8000:8000"]
    environment:
      # The browser runs on the host, so the API must accept the host origin during development.
      API_CORS_ALLOWED_ORIGINS: http://localhost:3000
      OIDC_ISSUER: http://keycloak.localhost:8080/realms/smart-travel
      # The maintenance database the test suite creates its throwaway databases from. Inside
      # compose there is no Docker socket, so Testcontainers cannot be used; this is the way in.
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smart_travel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smart_travel}
      # So the contract-parity tests can read packages/contracts from inside the container, where
      # the repository root is not an ancestor of /app.
      CONTRACTS_DIR: /contracts
    volumes:
      # Read-only mounts: the container reloads on save but cannot write back into the repository.
      - ./services/api/app:/app/app:ro
      - ./services/api/migrations:/app/migrations:ro
      - ./services/api/tests:/app/tests:ro
      - ./services/api/pyproject.toml:/app/pyproject.toml:ro
      - ./services/api/alembic.ini:/app/alembic.ini:ro
      - ./packages/contracts:/contracts:ro
      # Writable, and deliberately not a bind mount: pytest, ruff and mypy write their caches here,
      # and pointing them at the read-only source would fail before the first test ran.
      - api-dev-cache:/app/.cache
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000 --reload --no-access-log

  web:
    # Development image keeps pnpm and source tooling; the production runtime
    # remains the standalone, non-root image defined in compose.yaml.
    image: smart-travel-web:dev
    build:
      target: development
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      API_BASE_URL: http://api:8000
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      AUTH_KEYCLOAK_ID: web
      AUTH_KEYCLOAK_ISSUER: http://keycloak.localhost:8080/realms/smart-travel
      AUTH_KEYCLOAK_INTERNAL_ORIGIN: http://keycloak:8080
    volumes:
      - ./apps/web:/app
      - web-node-modules:/app/node_modules
    command: ["pnpm", "dev", "--hostname", "0.0.0.0"]

  risk-knowledge:
    ports: ["8004:8004"]
    volumes:
      - ./services/risk-knowledge/app:/app/app:ro
      - ./services/risk-knowledge/governance:/app/governance:ro
      - ./services/risk-knowledge/knowledge:/app/knowledge:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8004", "--reload", "--no-server-header", "--no-access-log"]

  decision-engine:
    ports: ["8005:8005"]
    volumes:
      - ./services/decision-engine/app:/app/app:ro
      - ./services/decision-engine/policies:/app/policies:ro
      - ./services/decision-engine/migrations:/app/migrations:ro
      - ./services/decision-engine/tests:/app/tests:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8005", "--reload", "--no-access-log"]

  mlflow:
    ports: ["5000:5000"]

  recommendation:
    image: smart-travel-recommendation:dev
    build:
      target: dev
    ports: ["8006:8006"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smart_travel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smart_travel}
    volumes:
      - ./services/recommendation/app:/app/app:ro
      - ./services/recommendation/tests:/app/tests:ro
      - ./services/recommendation/migrations:/app/migrations:ro
      - ./services/recommendation/emergency-directory:/app/emergency-directory:ro
      - ./services/recommendation/alembic.ini:/app/alembic.ini:ro
      - ./services/recommendation/pyproject.toml:/app/pyproject.toml:ro
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8006 --reload

  #
  # external-data:
  #   ports: ["8002:8002"]
  #   volumes:
  #     - ./services/external-data/app:/app/app:ro
  #   command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8002", "--reload"]
  #
  # web:
  #   ports: ["3000:3000"]
  #   volumes:
  #     - ./apps/web:/app
  #     - /app/node_modules
  #   command: ["pnpm", "dev"]

volumes:
  api-dev-cache:
  web-node-modules:
