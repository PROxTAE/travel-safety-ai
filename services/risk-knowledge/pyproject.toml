[project]
name = "smart-travel-risk-knowledge"
version = "0.1.0"
description = "Risk model, approved knowledge, and route evaluation service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.20.0",
  "asyncpg==0.31.0",
  "cryptography==50.0.1",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "joblib==1.5.2",
  "numpy==2.3.3",
  "opentelemetry-api==1.44.0",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
  "opentelemetry-instrumentation-fastapi==0.65b0",
  "opentelemetry-sdk==1.44.0",
  "prometheus-client==0.26.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "pyyaml==6.0.3",
  "pypdf==6.1.1",
  "rank-bm25==0.2.2",
  "scikit-learn==1.7.2",
  "shapely==2.1.2",
  "sqlalchemy[asyncio]==2.0.54",
  "structlog==26.1.0",
  "uvicorn[standard]==0.53.0",
]

[dependency-groups]
dev = [
  "jsonschema[format]==4.25.1",
  "mypy==1.18.1",
  "openapi-spec-validator==0.7.2",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "respx==0.22.0",
  "ruff==0.13.0",
  "testcontainers[postgres]==4.13.0",
  "types-jsonschema==4.25.1.20251009",
]

[project.scripts]
risk-knowledge-verify-model = "app.cli.verify_model:main"
risk-knowledge-qdrant = "app.cli.qdrant_collection:main"
risk-knowledge-train = "training.train:main"
risk-knowledge-promote = "training.promote:main"
risk-knowledge-release-check = "training.release_check:main"
risk-knowledge-knowledge-release = "training.knowledge_release:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "training"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers -o cache_dir=/tmp/pytest-cache"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: requires Docker and real local infrastructure",
]

[tool.ruff]
target-version = "py312"
line-length = 100
cache-dir = "/tmp/ruff-cache"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["yaml", "joblib", "rank_bm25", "shapely.*", "sklearn.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
  "app/cli/*",
  "app/main.py",
  "app/observability.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
