[project]
name = "smart-travel-agent"
version = "0.1.0"
description = "Travel AI Agent (module 03): LangGraph orchestration that plans, calls approved tools and never decides safety itself."
requires-python = ">=3.12,<3.13"

dependencies = [
    # Web framework and settings
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import order
    "N",         # naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # shadowed builtins
    "C4",        # comprehensions
    "DTZ",       # naive datetimes - a timestamp without a timezone is a bug in this system
    "T20",       # no print()
    "SIM",
    "RUF",
    "ASYNC",     # blocking calls in async code
    "S",         # bandit
]
ignore = [
    "S101",  # assert is how the tests express intent
    "N818",  # exceptions are named after the contract error they carry
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # test-only placeholder credentials

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
disallow_any_generics = true
files = ["app"]

# Without init_typed the pydantic plugin types every synthesised `__init__` argument as `Any`, so
# `strict = true` checks nothing at the point where a model is built.
[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_untyped_fields = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: needs a real PostgreSQL or Redis (Testcontainers); skipped when Docker is absent",
]

# uv installs this group by default; the Dockerfile builds with `uv sync --no-dev` so none of it
# reaches the runtime image.
[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=6.0,<7",
    "httpx>=0.27,<0.29",
    "mypy>=1.13,<2",
    "ruff>=0.7,<0.9",
]
