# Alembic configuration for the public API service.
#
# The database URL is NOT set here. It is built in migrations/env.py from the same Settings object
# the application uses, so migrations cannot run against a different database than the service, and
# so a password never sits in a committed file.

[alembic]
script_location = migrations
prepend_sys_path = .

# UTC, sortable, and with the slug in the name so `ls versions/` reads as a history.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

# Fail rather than silently truncate: a revision whose name is cut off is one nobody can find.
truncate_slug_length = 60

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
