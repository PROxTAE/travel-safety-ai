[project]
name = "smart-travel-api"
version = "0.1.0"
description = "Public API for the Smart Travel Assistant — the only HTTP surface a browser may reach."
requires-python = ">=3.12,<3.13"

dependencies = [
    # Web framework and settings
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "orjson>=3.10,<4",
    # Persistence. asyncpg because every request path is async; psycopg is pulled in for
    # Alembic, which runs migrations synchronously.
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    # Cache, rate limiting and run status. Not a system of record.
    "redis>=5.2,<6",
    # Outbound calls to internal services only, never to a provider chosen by a user.
    "httpx>=0.27,<0.29",
    "tenacity>=9.0,<10",
    # Observability
    "structlog>=24.4,<25",
    "prometheus-client>=0.21,<0.22",
    "opentelemetry-sdk>=1.28,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.28,<2",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-asyncpg>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "pyjwt[crypto]>=2.10,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import order
    "N",         # naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # shadowed builtins
    "C4",        # comprehensions
    "DTZ",       # naive datetimes - a timestamp without a timezone is a bug in this system
    "T20",       # no print()
    "SIM",
    "RUF",
    "ASYNC",     # blocking calls in async code
    "S",         # bandit
]
ignore = [
    "S101",  # assert is how the tests express intent
    # Exceptions here are named after the contract error they carry (NotFound, RateLimited,
    # IdempotencyConflict). An `Error` suffix would put the word twice in every raise site and
    # hide the one-to-one correspondence with the error codes in the contract.
    "N818",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # test-only placeholder credentials
"migrations/*" = ["N999"]     # revision file names come from Alembic

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
disallow_any_generics = true
files = ["app"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: needs a real PostgreSQL or Redis (Testcontainers); skipped when Docker is absent",
]

# uv installs this group by default; the Dockerfile builds with `uv sync --no-dev` so none of it
# reaches the runtime image.
[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=6.0,<7",
    "respx>=0.21,<0.23",
    "testcontainers[postgres]>=4.8,<5",
    "hypothesis>=6.115,<7",
    "mypy>=1.13,<2",
    "ruff>=0.7,<0.9",
    # Reads the contract YAML in the parity tests.
    "pyyaml>=6.0,<7",
    "types-pyyaml>=6.0,<7",
    "freezegun>=1.5,<2",
]
