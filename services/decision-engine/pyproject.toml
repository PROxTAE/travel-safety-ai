[project]
name = "smart-travel-decision-engine"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "jinja2==3.1.6",
  "jsonschema[format]==4.25.1",
  "openai==1.109.1",
  "asyncpg==0.31.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "prometheus-client==0.26.0",
  "pyyaml==6.0.3",
  "redis==5.2.1",
  "uvicorn[standard]==0.53.0",
]

[dependency-groups]
dev = [
  "asyncpg-stubs==0.30.0",
  "hypothesis==6.131.9",
  "jsonschema[format]==4.25.1",
  "mypy==1.18.1",
  "pytest==9.1.1",
  "ruff==0.13.0",
  "types-jsonschema==4.25.1.20250822",
  "types-PyYAML==6.0.12.20250915",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]