name: ci

# CI พื้นฐาน (ชั่วคราว จนกว่า lead/module จะเพิ่ม lint/typecheck/test จริงตาม 00_GIT_DOCKER_DELIVERY_RULES §12):
# รันทุกครั้งที่เปิด PR เข้า main และทุกครั้งที่ push ขึ้น branch ตามกติกา <type>/<NN>-<desc>
# ชื่อ workflow "ci" ถูกอ้างใน discord-ci.yml — เปลี่ยนชื่อต้องแก้ทั้งคู่
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'test/**'
      - 'docs/**'
      - 'refactor/**'
      - 'chore/**'
      - 'contract/**'
      - 'infra/**'

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: ดึงโค้ดออกมา
        uses: actions/checkout@v4

      - name: ติดตั้ง Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ตรวจไฟล์บังคับว่ามีครบ
        run: |
          test -f README.md || { echo "::error::ไม่มีไฟล์ README.md"; exit 1; }
          test -f .gitignore || { echo "::error::ไม่มีไฟล์ .gitignore"; exit 1; }
          echo "ไฟล์พื้นฐานครบ"

      - name: กันไฟล์ความลับหลุดขึ้น repo
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|\.key$'; then
            echo "::error::พบไฟล์ความลับถูก commit ขึ้นมา กรุณาลบออกและใส่ใน .gitignore"
            exit 1
          fi
          echo "ไม่พบไฟล์ความลับ"

      - name: ตรวจไวยากรณ์ไฟล์ Python ทั้งหมด
        run: |
          FILES=$(git ls-files '*.py')
          if [ -z "$FILES" ]; then
            echo "ยังไม่มีไฟล์ .py ข้ามขั้นตอนนี้"
          else
            python -m compileall -q $FILES
            echo "ไฟล์ Python ผ่านการตรวจไวยากรณ์"
          fi

      - name: ติดตั้ง dependency และรันเทส (ถ้ามี)
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          # รัน pytest เฉพาะไฟล์เทสที่ "ไม่มี" pyproject.toml เป็นของตัวเอง
          #
          # ชุดเทสที่มี pyproject.toml ของตัวเอง (เช่น tests/contract/) ประกาศ dependency เองและมี
          # workflow ของตัวเองที่ติดตั้งผ่าน uv ให้ครบ — การเอา `pip install pytest` เปล่า ๆ มารัน
          # จะพังที่ ImportError เสมอ ไม่ใช่เพราะเทสผิด แต่เพราะติดตั้งไม่ครบ
          #
          # ตัวนี้ยังเป็นตาข่ายรับไฟล์เทสธรรมดาที่ใครวางไว้ใน tests/ ตรง ๆ ตามเดิม
          standalone=""
          for f in $(git ls-files 'tests/**/*.py' 'tests/*.py'); do
            dir=$(dirname "$f")
            owned=""
            while [ "$dir" != "." ] && [ "$dir" != "/" ]; do
              if [ -f "$dir/pyproject.toml" ]; then
                owned="yes"
                break
              fi
              dir=$(dirname "$dir")
            done
            if [ -z "$owned" ]; then
              standalone="$standalone $f"
            fi
          done

          if [ -n "$standalone" ]; then
            pip install pytest
            # shellcheck disable=SC2086
            pytest -q $standalone
          else
            echo "ไม่มีไฟล์เทส Python แบบ standalone ใน tests/ (ชุดที่มี pyproject.toml ของตัวเอง รันใน workflow ของมันเอง) ข้ามการรันเทส"
          fi
