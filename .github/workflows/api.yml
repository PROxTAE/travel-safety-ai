name: api

# Gate on services/api (module 02). The public API is the only surface a browser reaches, so a
# regression here is a regression for every user of the product, not just for one module.
#
# The job is split so a failure names what broke: lint and types first, then the fast suite, then
# the migration tests against a real PostGIS container, then a Docker build that proves the image
# is reproducible and non-root.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'test/**'
      - 'refactor/**'
      - 'contract/**'

defaults:
  run:
    working-directory: services/api

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    steps:
      - name: ดึงโค้ดออกมา
        uses: actions/checkout@v4

      - name: ข้ามงานถ้าสาขานี้ยังไม่มี services/api
        id: present
        working-directory: .
        run: |
          if [ -f services/api/pyproject.toml ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "ยังไม่มี services/api ในสาขานี้ ข้าม"
          fi

      - name: ติดตั้ง uv
        if: steps.present.outputs.run == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - name: ติดตั้ง dependency จาก lockfile
        if: steps.present.outputs.run == 'true'
        run: uv sync --frozen

      - name: ruff (lint + format)
        if: steps.present.outputs.run == 'true'
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: mypy (strict)
        if: steps.present.outputs.run == 'true'
        run: uv run mypy app

      # แยกจาก integration เพื่อให้ feedback เร็วและบอกได้ว่าพังเพราะโค้ดหรือเพราะ Docker
      - name: unit tests
        if: steps.present.outputs.run == 'true'
        run: uv run pytest -m "not integration" --cov=app --cov-report=term-missing

      # Testcontainers starts PostGIS; the Keycloak tests skip themselves because no realm is
      # running here. They are covered by the local run and by the acceptance runbook.
      - name: integration tests (PostGIS จริงผ่าน Testcontainers)
        if: steps.present.outputs.run == 'true'
        run: uv run pytest -m integration -rs

      - name: build image
        if: steps.present.outputs.run == 'true'
        working-directory: .
        run: docker build -t sta-api:ci ./services/api

      - name: ตรวจว่า image ไม่ได้รันด้วย root และไม่มีไฟล์ที่ไม่ควรอยู่
        if: steps.present.outputs.run == 'true'
        working-directory: .
        run: |
          uid=$(docker run --rm --entrypoint python sta-api:ci -c "import os; print(os.getuid())")
          if [ "$uid" = "0" ]; then
            echo "::error::image รันด้วย root"
            exit 1
          fi
          echo "image รันด้วย uid $uid"

          for path in /app/.env /app/tests /app/.git /app/uv.lock /app/.venv/bin/uv; do
            if docker run --rm --entrypoint sh sta-api:ci -c "test -e $path"; then
              echo "::error::image ไม่ควรมี $path"
              exit 1
            fi
          done
          echo "ไม่มีไฟล์ต้องห้ามใน image"

      - name: ตรวจว่าไม่มี runtime mock switch (09_INTEGRATION_ACCEPTANCE_RUNBOOK §3)
        if: steps.present.outputs.run == 'true'
        run: |
          if grep -rnE "(USE_MOCK|mockMode|fakeRecommendation|hardcodedWeather|sampleCurrentData)" app; then
            echo "::error::พบ mock switch ใน runtime code"
            exit 1
          fi
          echo "ไม่พบ runtime mock switch"

      # The one that would be catastrophic and silent: a verifier that accepts `none` or an HMAC
      # algorithm can be forged with the provider's published public key.
      - name: ตรวจว่า JWT verification ไม่รับ algorithm ที่ไม่ปลอดภัย
        if: steps.present.outputs.run == 'true'
        run: |
          if grep -rnE "algorithms\s*=\s*\[?[\"']?(none|HS[0-9]{3})" app; then
            echo "::error::พบ symmetric/none algorithm ใน JWT verification"
            exit 1
          fi
          if grep -rn "verify_signature.*False" app; then
            echo "::error::พบการปิด signature verification"
            exit 1
          fi
          echo "JWT verification ใช้ asymmetric algorithm เท่านั้น"

      - name: ตรวจว่า realm import ไม่มี credential
        if: steps.present.outputs.run == 'true'
        working-directory: .
        run: |
          realm=infra/keycloak/smart-travel-realm.json
          test -f "$realm" || { echo "::error::ไม่มี realm import file"; exit 1; }
          python - "$realm" <<'PY'
          import json, sys
          realm = json.load(open(sys.argv[1], encoding="utf-8"))
          problems = []
          if realm.get("users"):
              problems.append("realm มี users ติดมาด้วย")
          for client in realm.get("clients", []):
              if client.get("secret"):
                  problems.append(f"client {client['clientId']} มี secret")
              if not client.get("publicClient", False) and not client.get("bearerOnly", False):
                  problems.append(f"client {client['clientId']} เป็น confidential (ต้องมี secret)")
          if problems:
              print("::error::" + "; ".join(problems))
              sys.exit(1)
          print("realm import ไม่มี credential")
          PY
