[project]
name = "smart-travel-contract-tests"
version = "0.1.0"
description = "Producer and consumer contract tests for packages/contracts. No service code and no network."
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema[format]>=4.23,<5",
    "pydantic>=2.9,<3",
    "pytest>=8.3,<9",
    "pyyaml>=6.0,<7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# Relative to whatever directory pytest is invoked from, so the repository wrapper passes the path
# explicitly: `uv run --project tests/contract pytest tests/contract`. Without that, running from
# the repository root would also collect every service's own suite, in an environment that has none
# of their dependencies installed.
testpaths = ["."]
addopts = "-q --strict-markers"
