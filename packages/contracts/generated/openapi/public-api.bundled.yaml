  responses:
    ValidationError:
      description: The request failed validation. `field_errors` names each rejected path.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            validation:
              $ref: "#/components/examples/ValidationErrorExample"
    Unauthorized:
      description: No token, or a token that failed verification.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated, but not permitted — typically a missing consent or scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: |
        No such resource for this caller. Resources owned by another user are reported as not
        found rather than forbidden, so that ids cannot be probed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    IdempotencyConflict:
      description: The idempotency key was reused with a different payload.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PreconditionFailed:
      description: The `If-Match` revision is stale. Re-read the resource and retry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PreconditionRequired:
      description: "`If-Match` is required for this operation and was not supplied."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Rate limit exceeded for this user, IP or endpoint bucket.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    DependencyUnavailable:
      description: |
        A dependency this operation needs is unavailable. The response says which capability is
        degraded; it never substitutes a plausible value for missing data.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    DependencyTimeout:
      description: A dependency did not answer inside its timeout budget.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
