            - type: "null"
    ConsentRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - granted
        - policy_version
      properties:
        type:
          $ref: "#/components/schemas/ConsentType"
        granted:
          type: boolean
        policy_version:
          $ref: "#/components/schemas/SemVer"
        expires_at:
          description: |
            Requested expiry for a scoped grant such as a live-location session. The server caps
            it at the configured maximum.
          $ref: "#/components/schemas/NullableTimestamp"
    ConsentResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/ConsentRecord"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    LocationSearchResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LocationRef"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    CreateTripRequest:
      type: object
      additionalProperties: false
      required:
        - origin
        - destination
        - departure_time
        - timezone
        - travel_modes
      properties:
        title:
          type:
            - string
            - "null"
          maxLength: 256
        origin:
          $ref: "#/components/schemas/LocationRef"
        destination:
          $ref: "#/components/schemas/LocationRef"
        departure_time:
          $ref: "#/components/schemas/Timestamp"
        return_time:
          $ref: "#/components/schemas/NullableTimestamp"
        timezone:
          $ref: "#/components/schemas/Timezone"
        travel_modes:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TravelMode"
        preferences:
          $ref: "#/components/schemas/TravelPreference"
    UpdateTripRequest:
      type: object
      additionalProperties: false
      description: Only the supplied fields change. Every change increments the trip revision.
      properties:
        title:
          type:
            - string
            - "null"
          maxLength: 256
        origin:
          $ref: "#/components/schemas/LocationRef"
        destination:
          $ref: "#/components/schemas/LocationRef"
        departure_time:
          $ref: "#/components/schemas/Timestamp"
        return_time:
          $ref: "#/components/schemas/NullableTimestamp"
        timezone:
          $ref: "#/components/schemas/Timezone"
        travel_modes:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TravelMode"
        preferences:
          $ref: "#/components/schemas/TravelPreference"
        status:
          $ref: "#/components/schemas/TripStatus"
    TripResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/Trip"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    TripListResponse:
      type: object
      required:
        - data
        - meta
        - page
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Trip"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
        page:
          $ref: "#/components/schemas/PageMeta"
    DeletionStatusResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - resource_id
            - status
            - requested_at
          properties:
            resource_id:
              $ref: "#/components/schemas/Uuid"
            status:
              $ref: "#/components/schemas/DeletionStatus"
            requested_at:
              $ref: "#/components/schemas/Timestamp"
            completed_at:
              $ref: "#/components/schemas/NullableTimestamp"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    CreateAssessmentRequest:
      type: object
      additionalProperties: false
      description: |
        Everything here is optional: the journey itself comes from the stored trip, so a client
        cannot assess one trip while claiming another.
      properties:
        question:
          type:
            - string
            - "null"
          maxLength: 2000
        conversation_id:
          description: Continue an existing thread instead of starting a new one.
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        locale:
          $ref: "#/components/schemas/Locale"
        live_location_consent_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        avoid_areas:
          description: |
            Areas the traveller asked to avoid, drawn on the safety map. Advisory input to route
            evaluation, not a way to hide an official warning.
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/Polygon"
    RunRefResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/RunRef"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    RunStateResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/RunState"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    RecommendationResponseEnvelope:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/RecommendationResponse"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ApplyRouteRequest:
      type: object
      additionalProperties: false
      required:
        - recommendation_id
        - route_id
      properties:
        recommendation_id:
          description: The recommendation the route was offered in, so the choice is auditable.
          $ref: "#/components/schemas/Uuid"
        route_id:
          $ref: "#/components/schemas/Uuid"
        risk_acknowledged:
          description: |
            Required when the chosen route is MEDIUM or HIGH. Records that the traveller was
            shown the risk and accepted it. It never overrides a closure.
          type: boolean
          default: false
    ApplyRouteResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - trip
            - run
          properties:
            trip:
              $ref: "#/components/schemas/Trip"
            run:
              $ref: "#/components/schemas/RunRef"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    SafetyEventListResponse:
      type: object
      required:
        - data
        - meta
        - page
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SafetyEvent"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
        page:
          $ref: "#/components/schemas/PageMeta"
    ConversationListResponse:
      type: object
      required:
        - data
        - meta
        - page
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
        page:
          $ref: "#/components/schemas/PageMeta"
    ConversationMessageRequest:
      type: object
      additionalProperties: false
      required:
        - question
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 2000
        trip_id:
          description: Trip this question is about, when the thread is not already bound to one.
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        locale:
          $ref: "#/components/schemas/Locale"
    FeedbackRequest:
      type: object
      additionalProperties: false
      required:
        - recommendation_id
        - category
      properties:
        recommendation_id:
          $ref: "#/components/schemas/Uuid"
        category:
          $ref: "#/components/schemas/FeedbackCategory"
        text:
          description: |
            Free text. Redacted for phone numbers, e-mail addresses and precise coordinates
            before storage.
          type:
            - string
            - "null"
          maxLength: 2000
    FeedbackResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/FeedbackEvent"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    CreateAlertSubscriptionRequest:
      type: object
      additionalProperties: false
      required:
        - trip_id
        - channel
        - consent_id
      properties:
        trip_id:
          $ref: "#/components/schemas/Uuid"
        channel:
          $ref: "#/components/schemas/DeliveryChannel"
        consent_id:
          $ref: "#/components/schemas/Uuid"
        min_severity:
          $ref: "#/components/schemas/Severity"
    AlertSubscriptionResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/AlertSubscription"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    OfficialContactListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/OfficialContact"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    EmergencyPoiListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/EmergencyPoi"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    Timestamp:
      title: Timestamp
      description: ISO-8601 instant with an explicit offset, e.g. 2026-09-17T08:30:00Z.
      type: string
      format: date-time
    Uuid:
      title: Uuid
      description: "UUID, serialised in lowercase canonical form. Expressed as `format: uuid` alone rather
        than as a pattern as well: generators map the format onto a real UUID type whose canonical
        serialisation is already lowercase, whereas a pattern beside it forces the value back to a
        bare string."
      type: string
      format: uuid
    Locale:
      title: Locale
      description: BCP-47 language tag, e.g. th-TH or en-GB.
      type: string
      pattern: ^[a-zA-Z]{2,3}(-[a-zA-Z]{4})?(-([a-zA-Z]{2}|[0-9]{3}))?$
      maxLength: 35
    Timezone:
      title: Timezone
      description: IANA time zone identifier, e.g. Asia/Bangkok. Validated against the tz database at the
        boundary, not by pattern alone.
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[A-Za-z0-9+_-]+(/[A-Za-z0-9+_.-]+)*$
    CountryCode:
      title: CountryCode
      description: ISO-3166-1 alpha-2, uppercase.
      type: string
      pattern: ^[A-Z]{2}$
    ConsentType:
      title: ConsentType
      type: string
      enum:
        - LOCATION_ONCE
        - LOCATION_LIVE
        - ALERT_NOTIFICATION
        - ANALYTICS
        - EMERGENCY_PROFILE
    SemVer:
      title: SemVer
      type: string
      pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?$
    NullableTimestamp:
      title: NullableTimestamp
      type:
        - string
        - "null"
      format: date-time
    DegradationReason:
      title: DegradationReason
      type: string
      enum:
        - TIMEOUT
        - UNAVAILABLE
        - RATE_LIMITED
        - STALE_DATA
        - PARTIAL_COVERAGE
        - NOT_CONFIGURED
        - SCHEMA_MISMATCH
    DegradedService:
      title: DegradedService
      type: object
      required:
        - service
        - reason
      properties:
        service:
          type: string
          maxLength: 64
        reason:
          $ref: "#/components/schemas/DegradationReason"
        since:
          $ref: "#/components/schemas/NullableTimestamp"
        retrying:
          type: boolean
          default: false
    ErrorCode:
      title: ErrorCode
      description: Stable error codes. Adding a member is a minor contract change; removing or renaming
        one is breaking.
      type: string
      enum:
        - VALIDATION_ERROR
        - AUTHENTICATION_REQUIRED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - IDEMPOTENCY_CONFLICT
        - RATE_LIMITED
        - DEPENDENCY_TIMEOUT
        - DEPENDENCY_UNAVAILABLE
        - INSUFFICIENT_EVIDENCE
        - UNSUPPORTED_COVERAGE
        - POLICY_VALIDATION_FAILED
        - INTERNAL_ERROR
    FieldError:
      title: FieldError
      type: object
      required:
        - path
        - code
      properties:
        path:
          description: Dotted or indexed path into the rejected request, for example destination.coordinates.
          type: string
          maxLength: 256
        code:
          type: string
          enum:
            - REQUIRED
            - INVALID_FORMAT
            - OUT_OF_RANGE
            - TOO_LONG
            - TOO_SHORT
            - UNKNOWN_FIELD
            - UNSUPPORTED_VALUE
            - NOT_CONFIRMED
            - INCONSISTENT
        message:
          description: Optional user-safe detail. Never echoes a rejected value that is itself sensitive.
          type:
            - string
            - "null"
          maxLength: 512
    ErrorBody:
      title: ErrorBody
      type: object
      required:
        - code
        - message
        - retryable
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          description: Human-readable and safe to display. Never carries a stack trace, SQL, provider
            credential or internal host name.
          type: string
          maxLength: 1024
        field_errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
          default: []
        retryable:
          type: boolean
        retry_after_seconds:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 86400
    EmergencyContactPerson:
      title: EmergencyContactPerson
      type: object
      required:
        - name
        - phone
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
        relationship:
          type:
            - string
            - "null"
          maxLength: 64
        phone:
          description: E.164 where possible. Redacted from logs.
          type: string
          minLength: 3
          maxLength: 32
        locale:
          oneOf:
            - $ref: "#/components/schemas/Locale"
            - type: "null"
    InsuranceRef:
      title: InsuranceRef
      type: object
      required:
        - provider_name
      properties:
        provider_name:
          type: string
          maxLength: 256
        policy_reference:
          type:
            - string
            - "null"
          maxLength: 128
        emergency_phone:
          type:
            - string
            - "null"
          maxLength: 32
    Position:
      title: Position
      description: "[longitude, latitude] in WGS84. RFC 7946 also permits an elevation element; this
        contract does not carry one, because nothing in the system consumes altitude and an optional
        third element would make every generated type ambiguous."
      type: array
      minItems: 2
      maxItems: 2
      prefixItems:
        - type: number
          minimum: -180
          maximum: 180
        - type: number
          minimum: -90
          maximum: 90
      items: false
    Point:
      title: GeoJsonPoint
      type: object
      required:
        - type
        - coordinates
      properties:
        type:
          const: Point
        coordinates:
          $ref: "#/components/schemas/Position"
    TripStatus:
      title: TripStatus
      type: string
      enum:
        - DRAFT
        - PLANNED
        - ACTIVE
        - COMPLETED
        - CANCELLED
        - DELETED
    TravelMode:
      title: TravelMode
      type: string
      enum:
        - FLIGHT
        - TRAIN
        - BUS
        - CAR
        - WALK
        - BICYCLE
        - MULTIMODAL
    RecordId:
      title: RecordId
      description: "Identifier of a record as the producer mints it. Stable and reproducible: fetching the
        same fact twice must yield the same RecordId, because that is what lets module 05
        deduplicate across sources and what lets an operator trace one fact back through a log. A
        provider adapter therefore derives it from the provider key and the provider's own record id
        (for example `usgs:us7000abcd`), never from a random UUID, which would differ on every fetch
        and defeat both. A service that mints a record with no upstream identity may use a UUID
        here; the format is deliberately wide enough for both."
      type: string
      minLength: 1
      maxLength: 256
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:,+@/=-]*$
    DeletionStatus:
      title: DeletionStatus
      description: Reported by soft-delete endpoints; purge happens asynchronously across owned schemas.
      type: string
      enum:
        - PENDING
        - IN_PROGRESS
        - COMPLETED
        - FAILED
    Polygon:
      title: GeoJsonPolygon
      type: object
      required:
        - type
        - coordinates
      properties:
        type:
          const: Polygon
        coordinates:
          type: array
          minItems: 1
          items:
            type: array
            minItems: 4
            items:
              $ref: "#/components/schemas/Position"
    RunStatus:
      title: RunStatus
      type: string
      enum:
        - QUEUED
        - RUNNING
        - NEEDS_INPUT
        - COMPLETED
        - PARTIAL
        - FAILED
        - CANCELLED
    RunStage:
      title: RunStage
      description: Controlled progress stages surfaced over SSE (00_API_AND_DATA_CONTRACTS.md section 6).
      type: string
      enum:
        - VALIDATING
        - FETCHING_EXTERNAL_DATA
        - INTEGRATING_DATA
        - ASSESSING_RISK
        - RETRIEVING_GUIDANCE
        - EVALUATING_ROUTES
        - MAKING_DECISION
        - EXPLAINING
        - FORMATTING_RESPONSE
    MessageKey:
      title: MessageKey
      description: i18n key the web app resolves. Servers never send pre-translated progress copy.
      type: string
      pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
      maxLength: 128
    DisasterEventType:
      title: DisasterEventType
      type: string
      enum:
        - EARTHQUAKE
        - CYCLONE
        - STORM
        - FLOOD
        - WILDFIRE
        - VOLCANO
        - LANDSLIDE
        - EXTREME_TEMPERATURE
        - HEALTH
        - TRANSPORT_CLOSURE
        - OTHER
    HttpsUrl:
      title: HttpsUrl
      type: string
      format: uri
      maxLength: 2048
    SourceAuthority:
      title: SourceAuthority
      type: string
      enum:
        - OFFICIAL
        - INTERGOVERNMENTAL
        - LICENSED_PROVIDER
        - COMMUNITY
        - UNKNOWN
    Citation:
      title: Citation
      description: Every factual claim in the summary must be covered by one of these. Citations are
        produced from retrieved evidence and provenance records, never written by the language
        model.
      type: object
      required:
        - source_id
        - title
        - source_url
      properties:
        source_id:
          $ref: "#/components/schemas/RecordId"
        title:
          type: string
          maxLength: 512
        source_url:
          $ref: "#/components/schemas/HttpsUrl"
        authority:
          $ref: "#/components/schemas/SourceAuthority"
        observed_at:
          $ref: "#/components/schemas/NullableTimestamp"
        evidence_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
    ActionCode:
      title: ActionCode
      description: The only four actions the product may recommend. Locked by the decision engine before
        any LLM call.
      type: string
      enum:
        - NORMAL
        - CHANGE_ROUTE
        - DELAY
        - AVOID
    RiskLevel:
      title: RiskLevel
      type: string
      enum:
        - LOW
        - MEDIUM
        - HIGH
        - UNKNOWN
    UnitInterval:
      title: UnitInterval
      description: Normalised score in [0, 1].
      type: number
      minimum: 0
      maximum: 1
    ImmediateAction:
      title: ImmediateAction
      type: object
      required:
        - text
      properties:
        text:
          type: string
          maxLength: 512
        priority:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
        evidence_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
    RiskReasonCode:
      title: RiskReasonCode
      type: string
      enum:
        - SEVERE_WEATHER_CORRIDOR
        - HEAVY_PRECIPITATION
        - HIGH_WIND
        - LOW_VISIBILITY
        - SNOW_OR_ICE
        - EXTREME_TEMPERATURE
        - ACTIVE_DISASTER_ON_CORRIDOR
        - RECENT_EARTHQUAKE
        - FLOOD_RISK
        - WILDFIRE_SMOKE
        - OFFICIAL_CLOSURE
        - OFFICIAL_WARNING_ACTIVE
        - TRANSPORT_DISRUPTION
        - TRANSPORT_CANCELLED
        - NIGHT_TRAVEL
        - LONG_EXPOSURE_WINDOW
        - SPARSE_DATA_COVERAGE
        - STALE_EVIDENCE
        - CONFLICTING_EVIDENCE
    Severity:
      title: Severity
      type: string
      enum:
        - INFO
        - MINOR
        - MODERATE
        - SEVERE
        - EXTREME
        - UNKNOWN
    DecisionReason:
      title: DecisionReason
      type: object
      required:
        - code
        - text
      properties:
        code:
          $ref: "#/components/schemas/RiskReasonCode"
        text:
          type: string
          maxLength: 1000
        severity:
          $ref: "#/components/schemas/Severity"
        source_ids:
          type: array
          items:
            $ref: "#/components/schemas/RecordId"
          default: []
    LineString:
      title: GeoJsonLineString
      type: object
      required:
        - type
        - coordinates
      properties:
        type:
          const: LineString
        coordinates:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/Position"
    RouteLabel:
      title: RouteLabel
      type: string
      enum:
        - ORIGINAL
        - RECOMMENDED
        - FASTEST
        - LOWEST_RISK
        - ALTERNATIVE
    RouteSegment:
      title: RouteSegment
      type: object
      required:
        - segment_id
        - mode
        - distance_m
        - duration_seconds
      properties:
        segment_id:
          description: Reproducible within its route, for the same reason as route_id.
          $ref: "#/components/schemas/RecordId"
        mode:
          $ref: "#/components/schemas/TravelMode"
        from_name:
          type:
            - string
            - "null"
          maxLength: 256
        to_name:
          type:
            - string
            - "null"
          maxLength: 256
        geometry:
          oneOf:
            - $ref: "#/components/schemas/LineString"
            - type: "null"
        distance_m:
          type: number
          minimum: 0
        duration_seconds:
          type: number
          minimum: 0
        departure_time:
          $ref: "#/components/schemas/NullableTimestamp"
        arrival_time:
          $ref: "#/components/schemas/NullableTimestamp"
        transport_status_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
    RouteExposure:
      title: RouteExposure
      description: What this route is exposed to along its corridor within the travel window.
      type: object
      required:
        - score
        - closed
      properties:
        score:
          $ref: "#/components/schemas/UnitInterval"
        hazard_event_ids:
          type: array
          items:
            $ref: "#/components/schemas/Uuid"
          default: []
        weather_window_ids:
          type: array
          items:
            $ref: "#/components/schemas/Uuid"
          default: []
        closed:
          description: True when an official closure covers part of this route.
          type: boolean
        closure_source_ids:
          type: array
          items:
            $ref: "#/components/schemas/RecordId"
          default: []
    DataStatus:
      title: DataStatus
      type: string
      enum:
        - FRESH
        - STALE
        - UNAVAILABLE
        - CONFLICTING
        - PARTIAL
    QualityFlag:
      title: QualityFlag
      type: string
      enum:
        - MISSING
        - STALE
        - CONFLICTING
        - INFERRED
        - INCOMPLETE
        - OUTSIDE_COVERAGE
    QualityConflict:
      title: QualityConflict
      type: object
      required:
        - field_path
        - source_ids
      properties:
        field_path:
          type: string
          maxLength: 256
        source_ids:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/RecordId"
        resolution:
          type:
            - string
            - "null"
          enum:
            - HIGHEST_AUTHORITY
            - MOST_RECENT
            - MOST_CONSERVATIVE
            - UNRESOLVED
            - null
    ContentHash:
      title: ContentHash
      description: "Digest of the payload a record was derived from, prefixed with the algorithm that
        produced it. The prefix is the point: a bare hex string is ambiguous the moment a second
        algorithm is introduced, and an unprefixed value silently compares unequal to a prefixed one
        rather than failing. Used for deduplication and for detecting provider schema drift."
      type: string
      pattern: ^(sha256:[0-9a-f]{64}|sha512:[0-9a-f]{128})$
    MultiPolygon:
      title: GeoJsonMultiPolygon
      type: object
      required:
        - type
        - coordinates
