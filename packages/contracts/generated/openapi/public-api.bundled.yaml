          type: string
    HealthReadyResponse:
      type: object
      required:
        - status
        - checks
        - checked_at
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
        checks:
          type: array
          items:
            type: object
            required:
              - name
              - required
              - status
              - duration_ms
            properties:
              name:
                type: string
                description: Dependency key, for example postgres, redis, oidc, agent.
              required:
                type: boolean
                description: Whether a failure here makes the service unready.
              status:
                type: string
                enum:
                  - up
                  - down
                  - degraded
                  - skipped
              duration_ms:
                type: number
              detail:
                type:
                  - string
                  - "null"
                description: Short, user-safe reason. Never a connection string or credential.
        checked_at:
          $ref: "#/components/schemas/Timestamp"
    UserProfileResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/UserProfile"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      properties:
        locale:
          $ref: "#/components/schemas/Locale"
        timezone:
          $ref: "#/components/schemas/Timezone"
        home_country_code:
          oneOf:
            - $ref: "#/components/schemas/CountryCode"
            - type: "null"
    EmergencyProfileResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/EmergencyProfile"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    EmergencyProfileUpsertRequest:
      type: object
      additionalProperties: false
      properties:
        blood_type:
          type:
            - string
            - "null"
          enum:
            - A+
            - A-
            - B+
            - B-
            - AB+
            - AB-
            - O+
            - O-
            - UNKNOWN
            - null
        allergies:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 128
        medical_notes:
          type:
            - string
            - "null"
          maxLength: 2000
        medications:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 128
        contacts:
          type: array
          maxItems: 8
